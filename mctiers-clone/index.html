<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MC Tiers Clone</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b0b;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.topbar {
  width: 100%;
  background: #111;
  padding: 18px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

#search {
  margin-top: 15px;
  padding: 10px;
  width: 250px;
  border-radius: 8px;
  border: none;
}

.tabs {
  margin-top: 10px;
  display: flex;
  gap: 8px;
}

.tabs button {
  padding: 8px 12px;
  border: none;
  background: #222;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

#ranking {
  margin-top: 20px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.card {
  background: #151515;
  margin: 8px;
  padding: 14px;
  width: 90%;
  max-width: 380px;
  border-radius: 12px;
  border-left: 5px solid gray;
}

.top1 { border-left: 6px solid gold; }
.top2 { border-left: 6px solid silver; }
.top3 { border-left: 6px solid #cd7f32; }
</style>

</head>

<body>

<div class="topbar">🏆 MC Tiers Clone</div>

<input id="search" placeholder="Search..." onkeyup="searchPlayer()">

<div class="tabs">
  <button onclick="filterCategory('Overall')">Overall</button>
  <button onclick="filterCategory('PvP')">PvP</button>
  <button onclick="filterCategory('SMP')">SMP</button>
</div>

<div id="ranking"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allPlayers = [];
const rankingDiv = document.getElementById("ranking");

onSnapshot(collection(db, "players"), (snapshot) => {
  allPlayers = [];

  snapshot.forEach(doc => {
    allPlayers.push({ id: doc.id, ...doc.data() });
  });

  allPlayers.sort((a,b) => b.points - a.points);

  render(allPlayers);
});

function render(players) {
  rankingDiv.innerHTML = "";

  players.forEach((p, i) => {

    let cls = i === 0 ? "top1" :
              i === 1 ? "top2" :
              i === 2 ? "top3" : "";

    rankingDiv.innerHTML += `
      <div class="card ${cls}">
        <h2>#${i+1} ${p.name}</h2>
        <p>Tier: ${p.tier}</p>
        <p>Points: ${p.points}</p>
      </div>
    `;
  });
}

window.filterCategory = function(cat){
  render(allPlayers.filter(p => p.category === cat));
}

window.searchPlayer = function(){
  let val = document.getElementById("search").value.toLowerCase();
  render(allPlayers.filter(p => p.name.toLowerCase().includes(val)));
}

</script>

</body>
</html>
